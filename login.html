<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071018" />
    <title>Sign in to Voyager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="FrontEnd/styles.css" />
    <link rel="stylesheet" href="FrontEnd/login.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="Backend/login.js" defer></script>
  </head>
  <body class="login-page">
    <main class="login-card">
      <a class="login-brand" href="/" aria-label="Voyager home">
        <span class="brand-mark">V</span>
        <span>Voyager</span>
      </a>
      <p class="welcome-kicker">YOUR AI COMPANION</p>
      <h1>Welcome to Voyager</h1>
      <p class="login-description">Sign in with Google to continue to the Voyager subscription.</p>
      <div id="googleSignIn" class="google-signin">
        <button id="googleSignInPlaceholder" class="google-signin-placeholder" type="button" disabled>
          Google sign-in setup required
        </button>
      </div>
      <p id="loginStatus" class="login-status" role="status" aria-live="polite"></p>
      <p class="login-footnote">A $5/month PayPal subscription is required to use Voyager. AI-provider credentials are configured separately in settings.</p>
    </main>
  </body>
</html>
