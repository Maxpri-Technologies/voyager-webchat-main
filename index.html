<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Voyager</title>
    <link rel="stylesheet" href="FrontEnd/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Chats">
        <div class="sidebar-header">
          <strong>Voyager</strong>
          <button id="newChatButton" type="button">New chat</button>
        </div>
        <h2>Recent chats</h2>
        <div id="chatList" class="chat-list"></div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <label for="modeSelect">Mode</label>
          <select id="modeSelect">
            <option value="ask">Ask</option>
            <option value="agent">Agent</option>
          </select>
          <button id="settingsButton" type="button">Settings</button>
        </header>

        <section id="mainContent" class="main-content" aria-live="polite">
          <div id="emptyState" class="empty-state">
            <h1>What can I help with?</h1>
            <p>Enter a message below to start a chat.</p>
          </div>
          <div id="messages" class="messages"></div>
        </section>

        <form id="composerForm" class="composer">
          <label class="visually-hidden" for="promptInput">Message Voyager</label>
          <textarea id="promptInput" rows="2" placeholder="Message Voyager" required></textarea>
          <button id="sendButton" type="submit">Send</button>
        </form>
      </main>
    </div>

    <dialog id="settingsModal" aria-labelledby="settingsTitle">
      <form id="settingsForm" method="dialog">
        <h2 id="settingsTitle">AI settings</h2>
        <label for="apiBaseUrl">API base URL</label>
        <input id="apiBaseUrl" type="url" placeholder="https://api.openai.com/v1" />
        <label for="apiKey">API key</label>
        <input id="apiKey" type="password" autocomplete="off" />
        <label for="apiModel">Model</label>
        <input id="apiModel" type="text" placeholder="gpt-4o-mini" />
        <div class="dialog-actions">
          <button id="resetSettings" type="button">Reset</button>
          <button id="closeSettings" type="button">Cancel</button>
          <button id="saveSettings" type="button">Save</button>
        </div>
      </form>
    </dialog>

    <script src="Backend/app.js" defer></script>
  </body>
</html>
